name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"

      - name: Decode provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          echo "PROVISIONING_PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision" >> "$GITHUB_ENV"
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
        run: |
          KEY_PEM=$(echo "$ASC_KEY_CONTENT_BASE64" | base64 --decode)
          python3 - "$RUNNER_TEMP/asc_api_key.json" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$KEY_PEM" <<'EOF'
          import json, sys
          path, key_id, issuer_id, key = sys.argv[1:5]
          with open(path, "w") as f:
              json.dump({"key_id": key_id, "issuer_id": issuer_id, "key": key, "in_house": False}, f)
          EOF
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.json" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
